name: game_core
description: "Shared services for all games: ads, consent, analytics, storage, audio, haptics, review, theme, logger."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  in_app_review: ^2.0.12
  meta: ^1.19.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

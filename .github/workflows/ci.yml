name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4  # keep in sync with nixpkgs flutter in flake.lock
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - name: Test all workspace packages
        run: |
          set -e
          for dir in packages/* apps/*; do
            if [ -d "$dir/test" ]; then
              echo "::group::flutter test $dir"
              (cd "$dir" && flutter test)
              echo "::endgroup::"
            fi
          done

  build-android:
    # Catches Gradle / manifest breakage that analyze and unit tests can't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4  # keep in sync with nixpkgs flutter in flake.lock
          cache: true
      - run: flutter pub get
      - name: Build debug APKs
        run: |
          set -e
          for dir in apps/*; do
            if [ -d "$dir/android" ]; then
              echo "::group::flutter build apk $dir"
              (cd "$dir" && flutter build apk --debug)
              echo "::endgroup::"
            fi
          done

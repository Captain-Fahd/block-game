name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4  # keep in sync with nixpkgs flutter in flake.lock
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - name: Test all workspace packages
        run: |
          set -e
          for dir in packages/* apps/*; do
            if [ -d "$dir/test" ]; then
              echo "::group::flutter test $dir"
              (cd "$dir" && flutter test)
              echo "::endgroup::"
            fi
          done
